# Prometheus collects ("scrapes") every service's /metrics every 15 seconds and evaluates the
# alert rules on the result.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The three A2A experts. Their metrics app is mounted at /metrics/ (with the slash).
  - job_name: experts
    metrics_path: /metrics/
    static_configs:
      - targets: ["disease-agent:9201"]
        labels: {expert: disease, framework: crewai}
      - targets: ["fertilize-agent:9202"]
        labels: {expert: fertilize, framework: langchain}
      - targets: ["help-agent:9203"]
        labels: {expert: help, framework: langgraph}

  # The backend: HTTP/chat/LLM/tool metrics plus the orchestrator's A2A client metrics
  # (calls per expert, retries, circuit breaker state, guardrail events).
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8005"]
